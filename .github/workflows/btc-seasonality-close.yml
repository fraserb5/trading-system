name: BTC Seasonality - Close Position

on:
  schedule:
    - cron: '0 0 * * *'   # 00:00 UTC every day
  workflow_dispatch: {}

jobs:
  open:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python strategies/btc_seasonality_close.py
      - run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add logs/btc_seasonality_log.csv
          git add logs/btc_seasonality_results.csv || true
          git add logs/btc_seasonality_open_state.json || true
          git commit -m "BTC seasonality: close $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "No changes"
          git push